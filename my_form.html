<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        
        b {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #3498db; /* Updated color for headings */
        }
        
        input[type="text"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #3498db;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        input[type="submit"] {
            background: #3498db;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        input[type="submit"]:hover {
            background: #2980b9;
        }
        
        br {
            display: none;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            form {
                padding: 20px;
                margin: 10px;
            }
            
            input[type="text"],
            input[type="email"],
            textarea,
            select {
                padding: 10px;
                font-size: 14px;
            }
            
            .button-container {
                flex-direction: column;
                gap: 10px;
            }
            
            .button-container a,
            input[type="submit"] {
                width: 100%;
                padding: 12px;
                font-size: 14px;
                text-align: center;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            form {
                padding: 15px;
            }
            
            input[type="text"],
            input[type="email"],
            textarea,
            select {
                padding: 8px;
                font-size: 13px;
            }
            
            b {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <form action="">
        <b style="font-size: 18px; color: #2c3e50;">Name:</b>
        <input type="text" name="name" placeholder="Enter your name">
        <br><br>
        <b style="font-size: 18px; color: #2c3e50;">Email:</b>
        <input type="email" name="email" placeholder="Enter your email">
        <br><br>
        <b style="font-size: 18px; color: #2c3e50;">City:</b>
        <select name="city">
            <option value="">Select your city</option>
            <option value="lucknow">Lucknow</option>
            <option value="delhi">Delhi</option>
            <option value="mumbai">Mumbai</option>
            <option value="bangalore">Bangalore</option>
            <option value="chennai">Chennai</option>
            <option value="kolkata">Kolkata</option>
            <option value="hyderabad">Hyderabad</option>
            <option value="pune">Pune</option>
            <option value="ahmedabad">Ahmedabad</option>
            <option value="jaipur">Jaipur</option>
            <option value="kanpur">Kanpur</option>
            <option value="other">Other</option>
        </select>
        <br><br>
        <b>Message:</b>
        <textarea name="message" rows="5" placeholder="Enter your message"></textarea>
        <br><br>
        <div class="button-container" style="display: flex; gap: 10px; justify-content: space-between;">
            <a href="Resume.html" style="background: #7f8c8d; color: white; padding: 12px 25px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; transition: background-color 0.3s ease;">
                Back to Resume
            </a>
            <input type="submit" value="Submit">
        </div>
    </form>

</body>
</html>
